name: Build Talkora Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Talkora
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://fsharwhynwncqcmolmsy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_sNlnIwLXC6T6gqY-GHSXsA_qW0B1T6A
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Name APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Talkora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talkora-Android-APK
          path: Talkora.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Talkora Android APK
          body: |
            Latest installable Talkora Android APK.
            Download Talkora.apk and install it on your Android device.
          files: Talkora.apk
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
